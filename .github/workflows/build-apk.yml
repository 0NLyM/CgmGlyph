name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history + tags to build the changelog

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: glucose-glyph-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Rename APK for release
        if: github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk "glucose-glyph-1.0.${{ github.run_number }}.apk"

      - name: Build changelog
        if: github.ref == 'refs/heads/main'
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo "APK di debug, non firmato per il Play Store (installazione diretta/sideload)."
            echo "Si aggiorna sopra le versioni precedenti (stessa keystore di debug fissa)."
            echo ""
            echo "## Changelog"
            if [ -n "$PREV_TAG" ]; then
              git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges
            else
              git log --pretty=format:"- %s (%h)" --no-merges
            fi
          } > release_notes.md
          cat release_notes.md

      - name: Publish versioned release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "v1.0.${{ github.run_number }}"
          body_path: release_notes.md
          prerelease: false
          make_latest: true
          files: glucose-glyph-1.0.${{ github.run_number }}.apk

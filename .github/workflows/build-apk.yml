name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: glucose-glyph-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Rename APK for release
        if: github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk "glucose-glyph-1.0.${{ github.run_number }}.apk"

      - name: Publish versioned release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "v1.0.${{ github.run_number }}"
          body: |
            APK di debug generato automaticamente dal commit ${{ github.sha }}.
            Non firmato per il Play Store: va bene per installazione diretta (sideload).
            Firmato con la keystore di debug fissa del repo, quindi si installa
            come aggiornamento sopra le versioni precedenti (stesso versionCode
            progressivo: ${{ github.run_number }}).
          prerelease: true
          make_latest: true
          files: glucose-glyph-1.0.${{ github.run_number }}.apk

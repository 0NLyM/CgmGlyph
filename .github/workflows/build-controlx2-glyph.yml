name: Build ControlX2 Glyph APK

on:
  push:
    branches: ["controlx2-glyph"]
    paths: ["controlx2/**", ".github/workflows/build-controlx2-glyph.yml"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # Two APKs (phone + watch) plus the shared library modules; 30 was tight for one.
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: controlx2
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # controlx2/build.gradle unconditionally reads local.properties even when
      # use_local_pumpx2 isn't passed as a system property -- an absent file crashes
      # config, not just the pumpx2-local-jar path. An empty file is enough (matches
      # upstream's own CI, which does the same `touch`).
      - name: Create local.properties
        run: touch local.properties

      # Release builds sign with the committed debug.keystore (storepass "password",
      # alias "alias_name") so every CI run produces an APK signed by the same key --
      # a consistent key is what lets Android upgrade the installed app rather than
      # refusing with INSTALL_FAILED_UPDATE_INCOMPATIBLE. The credentials are baked into
      # mobile/build.gradle's signingConfigs.release defaults; no GitHub Secrets needed.
      # glyphBuildNumber feeds into controlx2_version (root build.gradle) so the version
      # string shown in the app's own Settings screen carries this same run number.
      # Fails in seconds rather than minutes when a shared module is broken, with an error that
      # points at the module instead of at whichever app happened to compile it first.
      - name: Build shared library modules
        run: ./gradlew :pixelfont:assembleRelease --stacktrace -PglyphBuildNumber=${{ github.run_number }}

      - name: Build release APK
        run: ./gradlew :mobile:assembleRelease --stacktrace -PglyphBuildNumber=${{ github.run_number }}

      # The watch app is a separate APK but deliberately shares this release and this build
      # number: phone and watch talk over the Data Layer and a mismatched pair is a real failure
      # mode, so they should never be installable at independently drifting versions.
      - name: Build wear release APK
        run: ./gradlew :wear:assembleRelease --stacktrace -PglyphBuildNumber=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: controlx2-glyph-debug-apk
          path: controlx2/mobile/build/outputs/apk/release/mobile-release.apk
          if-no-files-found: error

      # Actions artifacts need a GitHub login and come back as a zip -- awkward from a
      # phone. A Release asset downloads directly (no login, no unzipping).
      - name: Rename APK for release
        working-directory: . # override the job's controlx2/ default: both paths below are repo-root-relative
        run: |
          cp controlx2/mobile/build/outputs/apk/release/mobile-release.apk controlx2-glyph-debug.apk
          cp controlx2/wear/build/outputs/apk/release/wear-release.apk controlx2-glyph-wear.apk

      # Each push gets its own tagged release (build number in both the tag and the title,
      # matching the "-glyph.N" suffix the app's Settings screen shows) instead of overwriting
      # one fixed tag -- so old builds stay in the release history and you can always tell which
      # one you're looking at. make_latest keeps this one flagged as the repo's current release,
      # and since the asset filename never changes, the permanent GitHub URL
      # .../releases/latest/download/controlx2-glyph-debug.apk always resolves to whichever
      # build is newest without needing to be updated here.
      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: controlx2-glyph-v${{ github.run_number }}
          name: "ControlX2 Glyph build #${{ github.run_number }}"
          body: |
            APK non firmati per il Play Store (installazione diretta/sideload).
            Build automatica dal branch `controlx2-glyph`, commit ${{ github.sha }}.
            La versione mostrata in Impostazioni nell'app sarà `1.0.0-20260504-glyph.${{ github.run_number }}`.

            - `controlx2-glyph-debug.apk` — app per il telefono.
            - `controlx2-glyph-wear.apk` — app per l'orologio Wear OS, da installare con
              `adb install -r controlx2-glyph-wear.apk` via debug Wi-Fi. Va tenuta allo stesso
              numero di build dell'app telefono: le due comunicano fra loro e una coppia
              disallineata può non parlarsi.
          prerelease: false
          make_latest: true
          files: |
            controlx2-glyph-debug.apk
            controlx2-glyph-wear.apk
